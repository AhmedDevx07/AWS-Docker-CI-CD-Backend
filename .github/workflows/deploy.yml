
name: Deploy to AWS EC2 with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ahmeddevx07/tasks-project:latest .
          docker push ahmeddevx07/tasks-project:latest

      - name: Set up SSH key for EC2 access
        run: |
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > private-key.pem
          chmod 600 private-key.pem
          ssh-keygen -y -f private-key.pem > /dev/null

      - name: Deploy Docker image to EC2
        run: |
          ssh -i private-key.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} <<'EOF'
              set -e

              sudo docker pull ahmeddevx07/tasks-project:latest

              sudo docker stop tasks-project || true
              sudo docker rm tasks-project || true

              sudo docker run -d \
                --name tasks-project \
                --restart unless-stopped \
                --env-file /home/ubuntu/tasks-project.env \
                -p 3000:3000 \
                ahmeddevx07/tasks-project:latest

              sleep 5
              sudo docker ps
              sudo docker logs --tail 50 tasks-project
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f private-key.pem
